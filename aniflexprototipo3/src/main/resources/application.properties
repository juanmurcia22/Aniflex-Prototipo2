spring.application.name=aniflexproyecto2
server.port=8080

# Endpoint GraphQL: POST http://localhost:8080/graphql
spring.graphql.path=/graphql

# Consola para probar queries/mutations en el navegador: http://localhost:8080/graphiql
spring.graphql.graphiql.enabled=true

# Solo se necesita si el cliente React llama al servidor DIRECTO (sin el proxy de Vite).
spring.graphql.cors.allowed-origins=http://localhost:5173
spring.graphql.cors.allowed-methods=POST

# ---------------- MongoDB (base de datos NO relacional) ----------------
# La conexion se construye en config/MongoConfig.java (igual que el ejemplo del profe).
# Estos valores se pueden cambiar sin recompilar. Por defecto: Mongo local, base "Aniflex".
aniflex.mongodb.uri=mongodb://localhost:27017
aniflex.mongodb.database=Aniflex
# Segundos que espera el servidor a que Mongo responda antes de devolver un error al cliente.
aniflex.mongodb.timeout-segundos=3
# Carga 2 series y 2 episodios de ejemplo si las colecciones estan vacias.
aniflex.datos-iniciales=true
